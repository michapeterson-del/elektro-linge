<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141414">
  <title>Elektro Linge ERP</title>
  <link rel="icon" href="../favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="erp.css">
</head>
<body>
  <div id="lock" class="lock" hidden></div>

  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <img src="../assets/logo-mark-white.png" alt="" width="38" height="32">
        <span><strong>Elektro Linge</strong><small>ERP</small></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-nav="dashboard"><span class="ico">◧</span>Übersicht</a>
        <a href="#/leads" data-nav="leads"><span class="ico">⚡</span>Anfragen &amp; Kundenreise <b class="badge" id="nav-leads" hidden></b></a>
        <a href="#/kunden" data-nav="kunden"><span class="ico">☺</span>Kunden</a>
        <a href="#/angebote" data-nav="angebote"><span class="ico">✎</span>Angebote</a>
        <a href="#/rechnungen" data-nav="rechnungen"><span class="ico">€</span>Rechnungen</a>
        <a href="#/artikel" data-nav="artikel"><span class="ico">▤</span>Artikel &amp; Leistungen</a>
        <a href="#/lager" data-nav="lager"><span class="ico">▦</span>Lager <b class="badge warn" id="nav-lager" hidden></b></a>
        <a href="#/einstellungen" data-nav="einstellungen"><span class="ico">⚙</span>Einstellungen</a>
      </nav>
      <div class="sidebar-foot" id="mode-info"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Menü">☰</button>
        <div class="search">
          <input id="global-search" type="search" placeholder="Suchen: Kunde, Angebot, Artikel …" autocomplete="off">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <button class="btn btn-yellow" data-act="lead-new">+ Anfrage</button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="print-area" class="print-area"></div>

  <script src="app.js"></script>
</body>
</html>
